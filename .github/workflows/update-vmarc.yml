name: Update zvmtools.vmarc

# Keeps execs/zvmtools.vmarc in sync whenever a .exec is added, deleted,
# or modified. Triggers on pushes that touch execs/*.exec (but not on
# pushes that only touch the .vmarc itself, to avoid a commit loop) and
# can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'execs/*.exec'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-vmarc:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Rebuild zvmtools.vmarc
        id: rebuild
        run: |
          chmod +x scripts/*.sh
          ./scripts/update-vmarc.sh execs bin/vma | tee /tmp/update.log
          status="$(tail -n1 /tmp/update.log)"
          echo "status=${status}" >> "$GITHUB_OUTPUT"

      - name: Commit updated archive
        if: steps.rebuild.outputs.status == 'CHANGED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add execs/zvmtools.vmarc
          git commit -m "Rebuild zvmtools.vmarc [skip ci]"
          git push

